<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-labelledby="title desc">
  <title id="title">Lumina Logo — Concept 2 单色</title>
  <desc id="desc">单色剪影版本：深灰相机剪影，镜头为白色镂空，内部太阳为深灰。</desc>
  <g id="camera" fill="#1F2937">
    <path d="M46 40 v-4 a6 6 0 0 1 6-6 h16 a6 6 0 0 1 6 6 v4 z"/>
    <rect x="22" y="40" width="76" height="50" rx="14"/>
  </g>
  <!-- 镜头镂空（白） -->
  <circle cx="60" cy="65" r="14" fill="#FFFFFF"/>
  <g id="sunrise" fill="#1F2937">
    <path d="M53 65 a7 7 0 0 1 14 0 z"/>
    <rect x="50" y="70" width="20" height="2.5" rx="1.25"/>
  </g>
  <!-- 快门指示灯（白，剪影中镂空） -->
  <circle cx="86" cy="49" r="3" fill="#FFFFFF"/>
</svg>
