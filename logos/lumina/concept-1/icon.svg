<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-labelledby="title desc">
  <title id="title">Lumina Logo — Concept 1</title>
  <desc id="desc">极简相机，镜头中是一颗发光的光点，取景器凸起与快门指示灯同样极简。</desc>
  <g id="camera">
    <!-- 取景器凸起 -->
    <rect x="47" y="30" width="26" height="12" rx="5" fill="#0D9488"/>
    <!-- 机身 -->
    <rect x="24" y="38" width="72" height="52" rx="16" fill="none" stroke="#0D9488" stroke-width="6"/>
    <!-- 快门指示灯 -->
    <circle cx="86" cy="50" r="3" fill="#14B8A6"/>
  </g>
  <g id="light">
    <!-- 光晕 -->
    <circle cx="60" cy="64" r="12" fill="#CCFBF1"/>
    <!-- 镜头外圈 -->
    <circle cx="60" cy="64" r="16.5" fill="none" stroke="#0D9488" stroke-width="5"/>
    <!-- 光核 -->
    <circle cx="60" cy="64" r="7" fill="#14B8A6"/>
  </g>
</svg>
