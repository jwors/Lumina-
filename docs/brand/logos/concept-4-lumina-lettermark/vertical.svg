<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 920" width="720" height="920" role="img" aria-labelledby="t d">
  <title id="t">Lumina 字标 LOGO（lettermark）</title>
  <desc id="d">L 画成取景器裁切角，umina 为几何单线小写，i 点 = 唯一暖金 ALOGO</desc>
  <rect width="720" height="920" rx="96" fill="#F4F2EA"/>

  <!-- 字标即 LOGO：L = 取景框裁切角（竖 + 底脚 + 上翘小钩），其余小写几何单线 -->
  <g transform="translate(-38,150)" fill="none" stroke="#20251F" stroke-width="15" stroke-linecap="round" stroke-linejoin="round">
    <!-- L：取景角 -->
    <path d="M84 528 V700 H150 V668"/>
    <!-- u：双杆 + 底半圆 -->
    <path d="M196 588 L196 662 A38 38 0 0 0 272 662 L272 588"/>
    <!-- m：双拱三杆 -->
    <path d="M312 700 V626 A40 40 0 0 1 392 626 V700 M392 626 A40 40 0 0 1 472 626 V700"/>
    <!-- i：短杆（暖金点另行） -->
    <path d="M534 588 V700"/>
    <!-- n：单拱双杆 -->
    <path d="M574 700 V626 A40 40 0 0 1 654 626 V700"/>
    <!-- a：单层圈 + 右杆 -->
    <circle cx="716" cy="644" r="56"/>
    <path d="M772 588 V700"/>
  </g>
  <!-- i 的点：唯一暖金 = Lumina 之光 -->
  <circle cx="496" cy="588" r="11" fill="#D9A54A"/>
</svg>
