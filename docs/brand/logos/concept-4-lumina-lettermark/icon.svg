<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="t d">
  <title id="t">Lumina 图标（L 取景角）</title>
  <desc id="d">奶油圆角方上的单线 L——取景器裁切角 + 内角处一粒暖金光点</desc>
  <rect width="512" height="512" rx="112" fill="#F4F2EA"/>
  <!-- L：粗单线取景角 -->
  <path d="M170 128 V382 H364 V322"
        fill="none" stroke="#20251F" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 内角一粒光 -->
  <circle cx="332" cy="360" r="17" fill="#D9A54A"/>
</svg>
