<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="t1 d1">
  <title id="t1">Lumina · 黄金时刻</title>
  <desc id="d1">取景圆内一道倾斜的暖金地平线与一粒初升之日，日出正进入镜头</desc>
  <!-- Concept 1: Golden Hour — 封闭取景圆 + 倾斜金色地平线 + 旭日
       鼠尾草 #767F72 · 墨绿 #20251F · 暖金 #D9A54A -->
  <circle cx="256" cy="268" r="150" fill="none" stroke="#767F72" stroke-width="15" stroke-linecap="round"/>
  <!-- 倾斜的金色地平线（两端锚在圆周上，右端略高 = 旭日方向） -->
  <line x1="115" y1="319" x2="386" y2="193" stroke="#D9A54A" stroke-width="15" stroke-linecap="round"/>
  <!-- 初升之日（贴地平线沿线上方） -->
  <circle cx="213" cy="264" r="13" fill="#20251F"/>
</svg>
