<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Lumina mark">
  <!-- Lumina 抽象记号：取景环 + 一道单峰 + 环顶一段光弯
       = 镜头一抬，山峰进入光里。两个色相 + 一笔几何，极简抽象 -->
  <g fill="none" stroke="#767F72" stroke-width="17" stroke-linecap="round">
    <!-- 取景环（长段，绕大半周） -->
    <path d="M386 193 A 150 150 0 1 1 126 193"/>
  </g>
  <g fill="none" stroke="#D9A54A" stroke-width="17" stroke-linecap="round">
    <!-- 环顶光弯（短弧段 = 日） -->
    <path d="M126 193 A 150 150 0 0 1 386 193"/>
  </g>
  <!-- 单峰：两端搭在环上，峰尖伸向光弯 -->
  <g fill="none" stroke="#20251F" stroke-width="17" stroke-linecap="round" stroke-linejoin="round">
    <path d="M110 238 L 256 148 L 402 238"/>
  </g>
</svg>
