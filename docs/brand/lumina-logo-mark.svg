<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Lumina mark">
  <!-- Lumina 品牌记号 = 取景圆 + 圆内日出过山脊
       配色层级：鼠尾草取景 #767F72 · 墨绿山 #20251F · 暖金日 #D9A54A -->
  <g fill="none" stroke="#767F72" stroke-width="14" stroke-linecap="round">
    <circle cx="256" cy="268" r="150"/>
  </g>
  <!-- 山脊：两端搭在圆周上 -->
  <g fill="none" stroke="#20251F" stroke-width="14" stroke-linecap="round" stroke-linejoin="round">
    <path d="M110 238 L180 196 L234 262 L306 190 L402 238"/>
  </g>
  <!-- 日出于山右峰之上：暖金 -->
  <circle cx="256" cy="152" r="16" fill="#D9A54A"/>
</svg>
