<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Lumina mark A: aperture">
  <!-- 备选 A：光圈快门（风轮六叶，右上暖金叶=光之门）
       鼠尾草 #767F72 · 墨绿 #20251F · 暖金 #D9A54A -->
  <!-- 取景外环 -->
  <circle cx="256" cy="268" r="150" fill="none" stroke="#767F72" stroke-width="12" stroke-linecap="round"/>
  <!-- 六叶风轮：一根弦线旋转六次；暖金叶 = rotate(300) -->
  <g stroke="#20251F" stroke-width="16" stroke-linecap="round">
    <line x1="372.9" y1="251.6" x2="309.6" y2="162.9"/>
    <line x1="372.9" y1="251.6" x2="309.6" y2="162.9" transform="rotate(60 256 268)"/>
    <line x1="372.9" y1="251.6" x2="309.6" y2="162.9" transform="rotate(120 256 268)"/>
    <line x1="372.9" y1="251.6" x2="309.6" y2="162.9" transform="rotate(180 256 268)"/>
    <line x1="372.9" y1="251.6" x2="309.6" y2="162.9" transform="rotate(240 256 268)"/>
    <line x1="372.9" y1="251.6" x2="309.6" y2="162.9" transform="rotate(300 256 268)" stroke="#D9A54A"/>
  </g>
</svg>
